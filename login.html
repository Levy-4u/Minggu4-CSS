<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="login-page">
        <div class="login-container">
            <h2>PC Parts Store</h2>
            <p>Masuk untuk melihat komponen PC</p>

            <form action="index.html" method="post">
                <div class="form-group">
                    <label for="Username">Username</label>
                    <br>
                    <input type="text" id="Username" name="Username" placeholder="Nama Pengguna">
                </div>

                <br>
                <div class="form-group">
                    <label for="Password">Password</label>
                    <br>
                    <input type="text" id="Password" name="Password" placeholder="Kata Sandi">
                </div>

                <br>
                <button type="submit" class="button-submit">Masuk</button>
            </form>
        </div>
    </body>
</html>
