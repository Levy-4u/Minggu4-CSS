<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav class="navbar">
            <div class="logo">PC PARTS STORE</div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </nav>

        <section id="home" class="hero-section">
            <div class="hero-content">
            <h1>Upgrade PC, Maksimalkan <span class="highlight">Performa.</span></h1>
            </div>
        </section>

        <section id="products" class="collections-section">
            <h2>Products</h2>
            <div class="products-grid">
                <div class="product-card">
                    <div class="image-wrapper">
                        <img src="ssd.jpg" alt="SSD">
                    </div>
                    <p>SSD</p>
                </div>


                <div class="product-card">
                    <div class="image-wrapper">
                        <img src="ram.jpg" alt="RAM">
                    </div>
                    <p>RAM</p>
                </div>

                <div class="product-card">
                    <div class="image-wrapper">
                        <img src="processor.jpg" alt="Prosesor">
                    </div>
                    <p>Prosesor</p>
                </div>
            
                <div class="product-card">
                    <div class="image-wrapper">
                        <img src="vga.jpg" alt="Kartu Grafis">
                    </div>
                        <p>Kartu Grafis</p>
                    </div>
            </div>
        </section>

        <section id="about" class="about-section">
            <h2>About</h2>
            <p>Pilihan komponen untuk kebutuhan upgrade PC kamu.</p>
    </section>
    </body>
</html>
